# 仓库级身份：所有目标共用一份，各平台不许自己定义。
#
# 【为什么只有一处】一次发版，所有目标出的必须是同一个版本号 —— 玩家在不同
# 加载器上装到的 vX.Y.Z 必须是同一次改动。留在各平台里它们就能各自漂移，
# 而"某个目标悄悄落后"正是这套结构要治的病。
#
# 【读不到就失败】各平台由 gradle/identity.gradle 读本文件，缺键直接抛
# GradleException。悄悄退回默认值等于把那个病放回来，而且是静默的：
# jar 照样出得来，只是版本号对不上。

